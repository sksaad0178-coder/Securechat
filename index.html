:root{
  --a1:#2f80ff;--a2:#38c6ff;--acc:var(--a1);--grad:linear-gradient(135deg,var(--a1),var(--a2));--onacc:#fff;
  --bg:#f3f5fa;--bg2:#e8edf8;--card:#fff;--solid:#fff;--text:#0f172a;--dim:#6b7686;--line:rgba(15,23,42,.08);
  --hdr:rgba(243,245,250,.78);--input:#eef2f9;--them:#fff;--themetext:#0f172a;--glass:rgba(255,255,255,.7);
  --shadow:0 6px 22px rgba(35,55,110,.09);--shadow2:0 12px 34px rgba(35,55,110,.16);--red:#ff4d5e;--green:#22c55e;
  --inset:inset 3px 3px 7px rgba(35,55,110,.10),inset -3px -3px 7px rgba(255,255,255,.95);
  --login-bot1:#47a6ff;--login-bot2:#1b4fe6;--glow:rgba(47,128,255,.10);
  --fs:16px;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--sheet:cubic-bezier(.32,.72,0,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
}
html[data-theme=dark]{
  --bg:#07090f;--bg2:#0d1220;--card:rgba(255,255,255,.06);--solid:#141824;--text:#f2f5fb;--dim:#8b94a7;--line:rgba(255,255,255,.09);
  --hdr:rgba(7,9,15,.72);--input:rgba(255,255,255,.07);--them:rgba(255,255,255,.09);--themetext:#f2f5fb;--glass:rgba(255,255,255,.08);
  --shadow:0 8px 26px rgba(0,0,0,.45);--shadow2:0 14px 40px rgba(0,0,0,.6);
  --inset:inset 3px 3px 8px rgba(0,0,0,.55),inset -2px -2px 6px rgba(255,255,255,.04);
  --login-bot1:#1f4fd8;--login-bot2:#0a1a5c;--glow:rgba(70,120,255,.22);
}
@media (prefers-color-scheme:dark){html:not([data-theme]){--bg:#07090f;--text:#f2f5fb;--card:rgba(255,255,255,.06);--solid:#141824;--dim:#8b94a7;--them:rgba(255,255,255,.09);--themetext:#f2f5fb;--input:rgba(255,255,255,.07);--hdr:rgba(7,9,15,.72);--line:rgba(255,255,255,.09)}}
html[data-accent=purple]{--a1:#7c5cff;--a2:#c06bff}
html[data-accent=green]{--a1:#12b86a;--a2:#4be0a0}
html[data-accent=pink]{--a1:#ff4f8b;--a2:#ff8a5c}
html[data-accent=orange]{--a1:#ff8a00;--a2:#ffc23d}
html[data-accent=teal]{--a1:#0aa8b8;--a2:#3de0d0}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:400 var(--fs)/1.42 var(--font);overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--card);border:none;border-radius:16px;padding:13px 16px;cursor:pointer;font-weight:600;transition:transform .35s var(--spring),opacity .2s,background .25s,box-shadow .3s;touch-action:manipulation}
button:active{transform:scale(.94);transition-duration:.12s}
button:disabled{opacity:.35;pointer-events:none}
.hidden{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto;pointer-events:none}
.cta{background:linear-gradient(180deg,var(--login-bot1),var(--login-bot2));color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:17px 30px;width:100%;box-shadow:0 14px 30px rgba(20,60,200,.45),inset 0 1px 0 rgba(255,255,255,.35);font-size:1.05rem}
button.pri{background:var(--grad);color:#fff;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--a1) 70%,transparent)}
button.danger{background:rgba(255,77,94,.12);color:var(--red)}
.circ{width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--solid);box-shadow:var(--shadow);flex:none}
.circ.flat{background:transparent;box-shadow:none}
input,textarea,select{background:var(--input);border:1.5px solid transparent;border-radius:16px;padding:14px 16px;width:100%;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
input:focus,textarea:focus,select:focus{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 18%,transparent)}
textarea{resize:none}
::placeholder{color:var(--dim);opacity:.8}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#app::before{content:"";position:absolute;inset:-20% -20% auto auto;width:90vmax;height:70vmax;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;opacity:.9}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:transparent;transition:transform .55s var(--sheet),opacity .55s var(--sheet),filter .55s var(--sheet);will-change:transform;contain:layout paint}
#vList{background:var(--bg)}
#vChat{transform:translate3d(100%,0,0);box-shadow:-14px 0 40px rgba(0,0,0,.14);background:var(--bg);visibility:hidden;transition:transform .55s var(--sheet),visibility 0s .55s}
body.chat-open #vChat{transform:none;visibility:visible;transition:transform .55s var(--sheet),visibility 0s}
body.chat-open #vList{transform:translate3d(-24%,0,0) scale(.97);opacity:.5;filter:blur(1.5px)}
body.dragging .view{transition:none!important}

/* ---------- login (neumorphic card + blue base) ---------- */
#lock{z-index:60;background:var(--bg);overflow-y:auto}
.login-card{position:relative;background:var(--card);background:var(--solid);border-radius:0 0 54px 54px;padding:calc(34px + env(safe-area-inset-top)) 26px 34px;text-align:center;box-shadow:0 22px 50px rgba(30,60,140,.16);z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px}
.login-card h1{margin:6px 0 0;font-size:2rem;font-weight:800;letter-spacing:.02em;color:var(--text);text-transform:uppercase}
.login-card p{margin:0;color:var(--dim);font-size:.9rem;max-width:300px}
.orb{width:128px;height:128px;border-radius:50%;margin:4px 0 6px;display:grid;place-items:center;background:radial-gradient(circle at 32% 24%,#9be4ff 0,#4aa8ff 38%,#1f55ee 100%);box-shadow:0 22px 38px rgba(30,80,230,.38),inset 0 -10px 18px rgba(10,30,150,.35),inset 0 8px 14px rgba(255,255,255,.5);animation:float 4.5s ease-in-out infinite,pop .8s var(--spring) both}
.orb svg{width:62px;height:62px}
@keyframes float{50%{transform:translateY(-8px)}}
.fields{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.fields input{box-shadow:var(--inset);background:var(--input);border:1.5px solid transparent;border-radius:18px;padding:16px 18px}
.err{color:var(--red);font-size:.85rem;min-height:20px;font-weight:600}
.err.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.login-bot{flex:1;margin-top:-54px;padding:calc(54px + 30px) 28px calc(30px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--login-bot1),var(--login-bot2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative;z-index:1;min-height:200px}
.login-bot .cta{max-width:340px}
.login-bot .fine{color:rgba(255,255,255,.82);font-size:.8rem;text-align:center;max-width:300px;margin:0}
.login-bot .cta{background:linear-gradient(180deg,#6cb8ff,#2160ff);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 16px 40px rgba(110,190,255,.6),inset 0 1px 0 rgba(255,255,255,.4)}}

/* ---------- headers ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--hdr);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);position:relative;z-index:3}
.hdr-mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:center;text-align:left}
.hdr-mid .nm{font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.76rem;color:var(--dim);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sub.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.title-lg{padding:6px 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:2}
.title-lg h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em}
.title-lg .sub{margin-top:2px}
.tools{display:flex;gap:10px}

/* ---------- chat list ---------- */
.list{flex:1;overflow:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.row{display:flex;gap:14px;align-items:center;padding:13px 14px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .35s var(--spring),box-shadow .3s;animation:rowin .7s var(--ease) both;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.row:active{transform:scale(.97)}
@keyframes rowin{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:#fff;font-size:1.15rem;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)}
.row .n{font-weight:700}.row .l{font-size:.84rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--dim);opacity:.35;flex:none;transition:background .4s,transform .4s var(--spring),opacity .4s}.dot.on{background:var(--green);opacity:1;transform:scale(1.15)}
.badge{background:var(--grad);color:#fff;border-radius:999px;font-size:.72rem;font-weight:700;padding:2px 8px;min-width:22px;text-align:center}
.grow{flex:1;min-width:0}
.empty{margin:auto;padding:30px;text-align:center;color:var(--dim);animation:pop .8s var(--spring) both;max-width:300px}
.empty .orb{width:96px;height:96px;margin:0 auto 18px;animation:float 4.5s ease-in-out infinite}.empty .orb svg{width:46px;height:46px}
.empty b{color:var(--text)}

/* ---------- chat ---------- */
#msgs{flex:1;overflow:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;position:relative}
html[data-wall=aurora] #msgs{background:radial-gradient(70% 40% at 15% 0%,color-mix(in srgb,var(--a1) 16%,transparent),transparent),radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,var(--a2) 16%,transparent),transparent)}
html[data-wall=dots] #msgs{background-image:radial-gradient(color-mix(in srgb,var(--text) 10%,transparent) 1.2px,transparent 1.4px);background-size:22px 22px}
html[data-wall=sand] #msgs{background:#efe9dd}
html[data-wall=sand][data-theme=dark] #msgs{background:#17140f}
html[data-wall=night] #msgs{background:linear-gradient(180deg,#0b1030,#1b0f3d)}
.b{position:relative;max-width:80%;padding:10px 14px;border-radius:22px;word-break:break-word;white-space:pre-wrap;font-size:calc(var(--fs) - .5px);line-height:1.38;will-change:transform,opacity}
.b.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:7px;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--a1) 75%,transparent)}
.b.them{align-self:flex-start;background:var(--them);color:var(--themetext);border-bottom-left-radius:7px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html[data-bubble=tail] .b{border-radius:12px}
html[data-bubble=tail] .b.me::after,html[data-bubble=tail] .b.them::after{content:"";position:absolute;top:12px;border:7px solid transparent}
html[data-bubble=tail] .b.me::after{right:-12px;border-left-color:var(--a1)}
html[data-bubble=tail] .b.them::after{left:-12px;border-right-color:var(--them)}
.b.pop{animation:bpop .55s var(--spring) both}
.b.me.pop{transform-origin:100% 100%}.b.them.pop{transform-origin:0 100%}
@keyframes bpop{from{opacity:0;transform:translateY(16px) scale(.6)}to{opacity:1;transform:none}}
.b.gone{animation:bgone .28s var(--ease) both}
@keyframes bgone{to{opacity:0;transform:scale(.8);}}
.b img{max-width:100%;border-radius:16px;display:block}.b audio{max-width:100%;height:40px}.b a{color:inherit;font-weight:600;text-decoration:underline}
.b .meta{font-size:.68rem;opacity:.7;text-align:right;margin-top:3px;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.b .meta button{background:none;padding:0;border-radius:0;width:14px;height:14px;opacity:.6;box-shadow:none;color:inherit}
.b .meta svg.i{width:13px;height:13px;stroke-width:2.2}
#typing{font-size:.76rem;color:var(--dim);padding:0 22px;height:18px;transition:opacity .3s}
.composer{display:flex;gap:10px;align-items:flex-end;padding:8px 12px 10px;position:relative;z-index:3}
.pill{flex:1;display:flex;align-items:flex-end;background:var(--solid);border-radius:26px;box-shadow:var(--shadow);padding:4px}
.pill textarea{background:transparent;border:none;box-shadow:none!important;padding:11px 6px;max-height:120px;border-radius:20px}
.pill button.circ{width:40px;height:40px;box-shadow:none;background:transparent;color:var(--dim)}
.pill button.rec{color:#fff;background:var(--red);animation:ping2 1.2s infinite}
@keyframes ping2{50%{opacity:.6}}
#send{width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 10px 22px -6px color-mix(in srgb,var(--a1) 70%,transparent);flex:none}

/* ---------- sheet / settings ---------- */
.modal{position:fixed;inset:0;background:rgba(5,8,18,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:70;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s .5s}
.modal.show{opacity:1;visibility:visible;transition:opacity .4s var(--ease),visibility 0s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translate3d(0,100%,0);transition:transform .6s var(--sheet);-webkit-overflow-scrolling:touch}
html[data-theme=dark] .sheet{background:#10131c}
.modal.show .sheet{transform:none}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);background:color-mix(in srgb,var(--dim) 45%,transparent);margin:2px auto 6px;flex:none}
.sheet>*{flex:none}
.sheet h2{margin:0;font-size:1.3rem;font-weight:800}.sheet p{margin:0;color:var(--dim);font-size:.88rem}
.sheet>button{box-shadow:var(--shadow);background:var(--solid)}.sheet>button.pri{background:var(--grad)}.sheet>button.danger{background:rgba(255,77,94,.12);box-shadow:none}
.group{background:var(--solid);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.grp-t{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:8px 6px -4px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;justify-content:space-between}
.srow+.srow{border-top:1px solid var(--line)}
.srow .t{font-weight:600;font-size:.95rem}.srow .d{font-size:.78rem;color:var(--dim);font-weight:400;margin-top:1px}
.srow.col{flex-direction:column;align-items:stretch}
.seg{display:flex;background:var(--input);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;background:transparent;padding:8px 10px;border-radius:10px;font-size:.84rem;color:var(--dim);box-shadow:none}
.seg button.on{background:var(--solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.14)}
html[data-theme=dark] .seg button.on{background:rgba(255,255,255,.16)}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;padding:0;position:relative;box-shadow:inset 0 -4px 8px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.14)}
.sw button.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--text);opacity:.85}
.sw.wall button{border-radius:12px;width:54px;height:40px}.sw.wall button.on::after{border-radius:16px}
.sw-s{position:relative;width:51px;height:31px;flex:none}
.sw-s input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer;padding:0}
.sw-s i{position:absolute;inset:0;background:color-mix(in srgb,var(--dim) 40%,transparent);border-radius:999px;transition:background .35s var(--ease)}
.sw-s i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .45s var(--spring)}
.sw-s input:checked+i{background:var(--green)}.sw-s input:checked+i::after{transform:translateX(20px)}
.bigcode{font:800 2.2rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-align:center;padding:14px;user-select:all;color:var(--a1);background:var(--solid);border-radius:20px;box-shadow:var(--inset)}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>*{flex:1}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--a1);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.safety{font:700 1.3rem/1.6 ui-monospace,monospace;text-align:center;letter-spacing:.05em}
.sheet label:not(.sw-s){display:flex;gap:10px;align-items:flex-start;font-size:.88rem}

/* ---------- call ---------- */
#call{z-index:80;color:var(--text);background:radial-gradient(90% 60% at 50% 18%,color-mix(in srgb,var(--a2) 28%,transparent),transparent),var(--bg);opacity:0;transform:scale(1.08);visibility:hidden;transition:opacity .5s var(--ease),transform .65s var(--sheet),visibility 0s .65s}
html[data-theme=dark] #call{background:radial-gradient(90% 60% at 50% 18%,color-mix(in srgb,var(--a1) 35%,transparent),transparent),#05070d}
#call.on{opacity:1;transform:none;visibility:visible;transition:opacity .5s var(--ease),transform .65s var(--sheet),visibility 0s}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;visibility:hidden}
#lv{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));width:30%;max-width:140px;aspect-ratio:3/4;object-fit:cover;border-radius:20px;background:#222;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:scaleX(-1);transition:opacity .3s,transform .5s var(--spring)}
#lv.hidden{display:block!important;opacity:0;pointer-events:none;transform:scaleX(-1) scale(.6)}
#cinfo{position:absolute;top:16%;left:0;right:0;text-align:center}
#cinfo .av{width:150px;height:150px;font-size:3.4rem;margin:0 auto 22px;position:relative;box-shadow:0 22px 50px rgba(0,0,0,.25)}
#cinfo .av::before,#cinfo .av::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--a1);opacity:0}
#cinfo.ringing .av::before{animation:ring 2.2s var(--ease) infinite}#cinfo.ringing .av::after{animation:ring 2.2s var(--ease) .9s infinite}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
#cn2{font-size:1.7rem;font-weight:800}#cs2{color:var(--dim);margin-top:6px;font-weight:600;font-variant-numeric:tabular-nums}
body.vcall #cn2,body.vcall #cs2{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#cbar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:16px;padding:20px 12px calc(34px + env(safe-area-inset-bottom))}
#cbar button{width:64px;height:64px;border-radius:50%;padding:0;background:var(--solid);color:var(--text);box-shadow:var(--shadow2);display:grid;place-items:center}
html[data-theme=dark] #cbar button{background:rgba(255,255,255,.14);color:#fff}
#cbar button.off{background:var(--text);color:var(--bg)}
#call.rin #bMute,#call.rin #bCam,#call.rin #bFlip{display:none}
#call.rin #cbar{gap:60px}
#cbar .end{background:var(--red)!important;color:#fff!important}#cbar .end svg{transform:rotate(135deg)}
#cbar .ok{background:var(--green)!important;color:#fff!important;animation:bounce 1.2s infinite}
@keyframes bounce{50%{transform:scale(1.12)}}

/* ---------- toast / misc ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--solid);color:var(--text);padding:12px 18px;border-radius:999px;z-index:120;font-size:.88rem;font-weight:600;max-width:90%;text-align:center;box-shadow:var(--shadow2);animation:toast .7s var(--spring) both}
.toast.out{animation:toastout .35s var(--ease) both}
@keyframes toast{from{opacity:0;transform:translate(-50%,-40px) scale(.85)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,-26px) scale(.95)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="lock" class="screen">
  <div class="login-card">
    <div class="orb"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 12h36a10 10 0 0 1 10 10v18a10 10 0 0 1-10 10H34l-11 9c-1.4 1.1-3 .2-3-1.6V50h-6A10 10 0 0 1 4 40V22A10 10 0 0 1 14 12z" fill="#fff" transform="translate(0 -2)"/><rect x="25.5" y="21" width="13" height="11" rx="3" fill="#2a63ff"/><path d="M28.2 21v-3a3.8 3.8 0 0 1 7.6 0v3" fill="none" stroke="#2a63ff" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <h1 id="lockTitle">SecureChat</h1>
    <p id="lockHelp"></p>
    <div class="fields">
      <input id="uname" autocomplete="off" placeholder="Your name" class="hidden">
      <input id="pin" type="password" autocomplete="off" placeholder="Passphrase">
      <input id="pin2" type="password" autocomplete="off" placeholder="Repeat passphrase" class="hidden">
    </div>
    <div class="err" id="lockErr"></div>
  </div>
  <div class="login-bot">
    <button class="cta" id="lockBtn">Unlock</button>
    <p class="fine">End-to-end encrypted. Your messages go straight from phone to phone.</p>
  </div>
</div>

<div id="app" class="hidden">
  <div id="vList" class="view">
    <div class="hdr" style="background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:0">
      <div class="grow"></div>
      <div class="tools">
        <button class="circ" id="newChat" title="Add friend" data-ic="plus"></button>
        <button class="circ" id="openSettings" title="Settings" data-ic="sliders"></button>
      </div>
    </div>
    <div class="title-lg"><div><h1>Chats</h1><div class="sub" id="listSub">end-to-end encrypted</div></div></div>
    <div class="list" id="chats"></div>
  </div>

  <div id="vChat" class="view">
    <div class="hdr">
      <button class="circ" id="back" data-ic="back"></button>
      <div class="hdr-mid"><div class="av" id="cav" style="width:40px;height:40px;font-size:1rem"></div><div style="min-width:0"><div class="nm" id="cname"></div><div class="sub" id="cstat"></div></div></div>
      <button class="circ" id="aCall" title="Audio call" data-ic="phone"></button>
      <button class="circ" id="vCall" title="Video call" data-ic="video"></button>
      <button class="circ" id="cMenu" data-ic="more"></button>
    </div>
    <div id="msgs"></div>
    <div id="typing"></div>
    <div class="composer">
      <div class="pill">
        <button class="circ" id="attach" data-ic="clip"></button>
        <input type="file" id="file" class="hidden">
        <input type="file" id="bfile" accept=".json,application/json" class="hidden">
        <textarea id="txt" rows="1" placeholder="Message"></textarea>
        <button class="circ" id="mic" data-ic="mic"></button>
      </div>
      <button id="send" data-ic="send"></button>
    </div>
  </div>
</div>

<div id="call" class="screen">
  <video id="rv" autoplay playsinline></video>
  <div id="cinfo"><div class="av" id="cav2"></div><div id="cn2"></div><div id="cs2"></div></div>
  <video id="lv" autoplay playsinline muted class="hidden"></video>
  <div id="cbar">
    <button id="bAcc" class="ok hidden" data-ic="phone"></button>
    <button id="bMute" data-ic="mic"></button>
    <button id="bCam" data-ic="video"></button>
    <button id="bFlip" data-ic="flip"></button>
    <button id="bEnd" class="end" data-ic="phone"></button>
  </div>
</div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>

<script src="app.js"></script>
</body>
</html>
